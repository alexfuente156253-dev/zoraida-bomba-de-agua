; Compilacion alternativa con PlatformIO (el .ino sigue siendo compatible con Arduino IDE).
[platformio]
src_dir = control_bomba_b1_v10_3

[env:nano_produccion]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600

[env:nano_calibracion]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags = -DMODO_CALIBRACION

[env:nano_depuracion]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags = -DMODO_DEPURACION
